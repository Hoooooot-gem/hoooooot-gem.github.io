    <style>
        /* 与首页一致的极简留白：白底黑字，靠字阶和一条细线建立仪式感 */
        .unlock-main {
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .unlock {
            width: min(560px, 100%);
            text-align: center;
        }

        .unlock-icon {
            width: 44px;
            height: 44px;
            margin: 0 auto 28px;
            color: #86868b;
        }

        .unlock-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .unlock-title {
            margin: 0;
            font-size: clamp(2.25rem, 5vw, 3.5rem);
            font-weight: 600;
            line-height: 1.05;
            letter-spacing: -0.03em;
            color: #1d1d1f;
        }

        .unlock-sub {
            margin: 16px 0 0;
            font-size: 1rem;
            letter-spacing: 0.02em;
            color: #86868b;
        }

        .unlock-note {
            margin: 0 auto;
            max-width: 30em;
            font-size: 0.9375rem;
            line-height: 1.6;
            color: #6e6e73;
        }

        /* 资源说明用细线列表，保持与首页工具清单同一语汇 */
        .unlock-list {
            margin: 40px 0 0;
            padding: 0;
            list-style: none;
            border-top: 1px solid #d2d2d7;
            text-align: left;
        }

        .unlock-list li {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            padding: 14px 2px;
            border-bottom: 1px solid #d2d2d7;
            font-size: 0.9375rem;
            color: #6e6e73;
        }

        .unlock-list strong {
            font-weight: 500;
            color: #1d1d1f;
        }

        .unlock-action {
            margin-top: 40px;
        }

        .unlock-foot {
            margin: 28px 0 0;
            font-size: 0.75rem;
            color: #86868b;
        }
    </style>
</head>
<body class="page">

    <main class="unlock-main">
