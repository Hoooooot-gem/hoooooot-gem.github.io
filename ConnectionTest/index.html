<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连接测速 · Hoooooot's</title>

    <!-- 共享顶栏 / 底栏（默认 both） -->
    <script src="/js/components.js"></script>

    <!-- 全局样式 + 子页面 Apple 风格层 -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pages.css">

    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- 测速页专属：只保留与测速仪表盘相关的排版 -->
    <style>
        .speed-main {
            display: flex;
            justify-content: center;
            padding-bottom: clamp(80px, 10vw, 120px);
        }

        .speed-inner {
            width: min(640px, 100%);
            padding: 0 clamp(20px, 5vw, 40px);
            text-align: center;
        }

        /* 数字作为页面主体，字号与字距按首页大标题的比例放大 */
        .speed-number {
            font-size: clamp(3.5rem, 9vw, 5.5rem);
            font-weight: 600;
            line-height: 1;
            letter-spacing: -0.045em;
            font-variant-numeric: tabular-nums;
            color: #1d1d1f;
        }

        .speed-number .unit {
            margin-left: 10px;
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 0;
            color: #86868b;
        }

        .speed-status {
            margin-top: 16px;
            font-size: 0.9375rem;
            color: #6e6e73;
        }

        /* 三项指标改为细线表格，去掉卡片投影 */
        .speed-meta {
            margin: clamp(32px, 5vw, 48px) 0 0;
            padding: 0;
            border-top: 1px solid #d2d2d7;
        }

        .speed-meta > div {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 24px;
            padding: 16px 2px;
            border-bottom: 1px solid #d2d2d7;
        }

        .speed-meta dt {
            margin: 0;
            font-size: 0.9375rem;
            color: #86868b;
        }

        .speed-meta dd {
            margin: 0;
            font-size: 0.9375rem;
            font-weight: 500;
            color: #1d1d1f;
            font-variant-numeric: tabular-nums;
        }

        .speed-btn {
            margin-top: clamp(28px, 4vw, 40px);
            min-width: 180px;
        }

        .speed-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .speed-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body class="page has-chrome">

    <!-- 顶栏由 js/components.js 注入到 body 首部 -->

    <main class="speed-main">
        <div class="speed-inner">
            <header class="page-head">
                <p class="page-eyebrow">工具</p>
                <h1 class="page-title">连接测速</h1>
                <p class="page-lead">测量你与本站之间的实际带宽与延迟，全程在你的浏览器内完成。</p>
            </header>

            <div class="speed-number">
                <span id="speed">0</span>
                <span class="unit">Mbps</span>
            </div>

            <p class="speed-status" id="status">等待测试</p>

            <dl class="speed-meta">
                <div><dt>延迟 RTT</dt><dd id="ping">--</dd></div>
                <div><dt>服务器</dt><dd>日本</dd></div>
                <div><dt>状态</dt><dd id="quality">--</dd></div>
            </dl>

            <button class="pill pill--solid speed-btn" id="start">开始检测</button>
        </div>
    </main>

    <script src="/js/script.js"></script>

    <script>
        const FILE = "assets/connection/test-50MB.bin";

        const speed = document.getElementById("speed");
        const status = document.getElementById("status");
        const ping = document.getElementById("ping");
        const quality = document.getElementById("quality");
        const button = document.getElementById("start");

        let running = false;

        async function testPing() {
            const start = performance.now();
            await fetch(
                FILE + "?ping=" + Date.now(),
                { method: "HEAD", cache: "no-store" }
            );
            return Math.round(performance.now() - start);
        }

        async function startTest() {
            if (running) return;
            running = true;
            button.disabled = true;

            speed.textContent = "0";
            status.textContent = "正在连接 Hoooooot...";

            try {
                let rtt = await testPing();
                ping.textContent = rtt + " ms";

                status.textContent = "正在传输测试数据...";

                const response = await fetch(FILE + "?test=" + Date.now(), {
                    cache: "no-store"
                });
                const reader = response.body.getReader();

                let total = 0;
                let start = performance.now();
                let last = start;
                let lastBytes = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    total += value.length;

                    let now = performance.now();
                    // 每 50ms 刷新一次速度
                    if (now - last > 50) {
                        let seconds = (now - last) / 1000;
                        let bytes = total - lastBytes;
                        let Mbps = bytes * 8 / seconds / 1000000;

                        speed.textContent = Mbps.toFixed(1);

                        last = now;
                        lastBytes = total;
                    }
                }

                let totalTime = (performance.now() - start) / 1000;
                let average = total * 8 / totalTime / 1000000;

                speed.textContent = average.toFixed(2);

                status.textContent = "检测完成";

                if (average >= 100) quality.textContent = "Excellent";
                else if (average >= 50) quality.textContent = "Great";
                else if (average >= 10) quality.textContent = "Good";
                else quality.textContent = "Slow";

            } catch (e) {
                status.textContent = "连接失败";
                console.error(e);
            }

            button.disabled = false;
            running = false;
        }

        button.onclick = startTest;
    </script>
</body>
</html>
