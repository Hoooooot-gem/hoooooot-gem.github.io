<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高三5班 · 滚动祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fffef7;
            background-image: radial-gradient(circle at 30% 40%, rgba(255, 235, 200, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(220, 240, 255, 0.3) 0%, transparent 50%);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", "楷体", "KaiTi", serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* 主滚动容器 */
        .scroll-wrapper {
            width: 85%;
            max-width: 850px;
            height: 100vh;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
        }

        .scroll-track {
            display: flex;
            flex-direction: column;
            animation: scrollUp 100s linear infinite;
        }

        .card {
            background: rgba(255, 252, 245, 0.88);
            backdrop-filter: blur(4px);
            border: 1px solid #e6d7bd;
            border-radius: 18px;
            padding: 18px 22px;
            margin: 14px 0;
            box-shadow: 0 6px 16px rgba(140, 100, 50, 0.07);
        }

        .parent-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #5e3e1c;
            margin-bottom: 6px;
            border-bottom: 1px dotted #ddccaa;
            padding-bottom: 6px;
        }

        .parent-name::before {
            content: "🌸 ";
        }

        .blessing-text {
            font-size: 1rem;
            line-height: 1.75;
            color: #3d3226;
            white-space: pre-wrap;
        }

        @keyframes scrollUp {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-50%);
            }
        }
    </style>
</head>
<body>
    <div class="scroll-wrapper" id="scrollWrapper">
        <div class="scroll-track" id="scrollTrack"></div>
    </div>

</body>
</html>
