name: Bilibili Snapshot

# 抓取最新投稿，写进 data/videos.json —— 首页作品集板块的唯一数据源。
#
# 为什么 6 小时一次：每次提交都会触发一次完整的 Pages 部署，而本站有
# 70MB（含 50MB 测速样本），部署要 1 分钟。高频提交会让部署排队、
# 甚至撞上 GitHub 的构建限流导致超时失败（2026-11-07 踩过）。
# 需求上「一天内更新即可」，6 小时一次完全够用，且把部署次数压到最低。
#
# 抓取失败时脚本会保留上一次的快照不覆盖，所以页面不会因为一次风控就变空。

on:
  schedule:
    # UTC 时间，每 6 小时的第 7 分钟（01:07 / 07:07 / 13:07 / 19:07 北京时间）
    - cron: '7 */6 * * *'
  workflow_dispatch:
    inputs:
      mid:
        description: '临时覆盖 UP 主 UID（留空则用脚本默认值）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: bilibili-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取最新投稿
        env:
          BILI_MID: ${{ inputs.mid }}
        run: node scripts/fetch-bilibili.mjs

      - name: 有变化才提交
        run: |
          if [ -z "$(git status --porcelain data/videos.json)" ]; then
            echo "快照无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "chore(snapshot): 更新 B 站作品集快照"
          git push
